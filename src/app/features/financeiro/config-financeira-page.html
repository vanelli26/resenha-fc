<app-voltar para="gestao" rotulo="Gestão" />

<div class="cabecalho-secao">
  <h2>Configuração financeira</h2>
</div>

<app-planos-cobranca [usoPorPlano]="usoPorPlano()" />

<section class="vencimentos">
  <h3>Vencimentos</h3>
  <p class="texto-suave dica">Valem para todos os planos da mesma periodicidade. Avulso vence na data do jogo.</p>

  <form class="cartao formulario" (submit)="$event.preventDefault(); salvarVencimentos()">
    <div class="vencimentos__campos">
      <label class="campo">
        <span>Mensal: dia do vencimento</span>
        <p-inputnumber [formField]="formulario.diaMensal" [useGrouping]="false" [fluid]="true" />
        @if (formulario.diaMensal().touched() && formulario.diaMensal().invalid()) {
          <small class="campo__erro">{{ formulario.diaMensal().errors()[0].message }}</small>
        }
      </label>
      <label class="campo">
        <span>Semestral: dia do vencimento</span>
        <p-inputnumber [formField]="formulario.diaSemestral" [useGrouping]="false" [fluid]="true" />
        @if (formulario.diaSemestral().touched() && formulario.diaSemestral().invalid()) {
          <small class="campo__erro">{{ formulario.diaSemestral().errors()[0].message }}</small>
        }
      </label>
      <label class="campo">
        <span>Mês de vencimento do 1º semestre</span>
        <p-select [formField]="formulario.mesS1" [options]="mesesS1" optionLabel="label" optionValue="value" appendTo="body" />
      </label>
      <label class="campo">
        <span>Mês de vencimento do 2º semestre</span>
        <p-select [formField]="formulario.mesS2" [options]="mesesS2" optionLabel="label" optionValue="value" appendTo="body" />
      </label>
    </div>
    <div class="acoes">
      <p-button label="Salvar vencimentos" type="submit" [loading]="salvando()" />
    </div>
  </form>
</section>

<app-despesas-recorrentes />
