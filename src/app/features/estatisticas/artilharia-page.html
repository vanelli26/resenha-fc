<app-elenco-abas />

<div class="topo">
  <app-navegador-periodo [periodo]="escopo()" (mudou)="irParaAno($event)" />
  @if (automatico(); as a) {
    <small class="texto-suave">
      {{ a.jogos }} {{ a.jogos === 1 ? 'jogo encerrado' : 'jogos encerrados' }} · {{ a.golsPro }} gols a favor
    </small>
  }
</div>

@if (carregando() && !automatico()) {
  <div class="lista">
    <p-skeleton height="3.5rem" />
    <p-skeleton height="3.5rem" />
    <p-skeleton height="3.5rem" />
  </div>
} @else {
  <app-ranking-artilharia
    [cadastros]="cadastros()"
    [automatico]="automaticoPorAtleta()"
    [ajustes]="ajustes()"
    [podeEditar]="ehDiretoria()"
    [salvando]="salvando()"
    [escopo]="'em ' + escopo()"
    [(editando)]="editando"
    (ajustar)="salvarAjuste($event)"
  />
}
