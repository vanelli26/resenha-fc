<div class="topo">
  <p-selectbutton
    [options]="opcoesMetrica"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
    [ngModel]="metrica()"
    (ngModelChange)="metrica.set($event)"
    size="small"
    ariaLabel="Ranking por"
  />
  @if (podeEditar()) {
    <p-button label="Lançar números" size="small" [outlined]="true" (onClick)="abrir(null)" />
  }
</div>

<ol class="lista ranking">
  @for (linha of linhas(); track linha.atleta.id) {
    <li>
      <button
        type="button"
        class="cartao linha"
        [class.linha--lider]="linha.posicao === 1"
        [disabled]="!podeEditar()"
        (click)="abrir(linha.atleta.id)"
      >
        <span class="linha__posicao">{{ linha.posicao }}º</span>
        <app-foto-pessoa [src]="linha.atleta.fotoUrl" [nome]="linha.atleta.apelido || linha.atleta.nome" />
        <span class="linha__nome">
          <strong>{{ linha.atleta.apelido || linha.atleta.nome }}</strong>
          @if (linha.ajustado) {
            <small class="texto-suave">ajustado</small>
          }
        </span>
        <span class="linha__numeros">
          <span class="linha__principal">{{ metrica() === 'gols' ? linha.gols : linha.assistencias }}</span>
          <small class="texto-suave">
            {{ metrica() === 'gols' ? linha.assistencias + ' assist.' : linha.gols + ' gols' }}
          </small>
        </span>
      </button>
    </li>
  } @empty {
    <li class="texto-suave">
      Nenhum {{ metrica() === 'gols' ? 'gol' : 'assistência' }} {{ escopo() }}. Os números vêm dos gols lançados ao
      encerrar os eventos.
    </li>
  }
</ol>

<p-dialog [header]="'Números ' + escopo()" [(visible)]="editando" [modal]="true" [style]="{ width: 'min(26rem, 100vw - 2rem)' }">
  @if (editando()) {
    <app-ajuste-artilharia
      [atletas]="opcoesAtleta()"
      [automatico]="automatico()"
      [atuais]="totais()"
      [atletaInicial]="atletaEmAjuste()"
      [salvando]="salvando()"
      (salvar)="ajustar.emit($event)"
      (cancelar)="editando.set(false)"
    />
  }
</p-dialog>
