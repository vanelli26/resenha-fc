@if (time(); as t) {
  <header class="cabecalho">
    <app-escudo [src]="t.escudo ?? ''" [nome]="t.nome" />
    <h1 class="cabecalho__nome">{{ t.nome }}</h1>
  </header>

  <!-- Uma aba só não precisa de navegação. No celular vira barra inferior. -->
  @if (abas().length > 1) {
    <nav class="abas" aria-label="Seções do time">
      @for (aba of abas(); track aba.caminho) {
        <a
          class="abas__item"
          [routerLink]="aba.caminho"
          routerLinkActive="abas__item--ativa"
          ariaCurrentWhenActive="page"
        >
          <span class="abas__icone">
            @switch (aba.icone) {
              @case ('agenda') {
                <svg data-p-icon="calendar" [size]="20"></svg>
              }
              @case ('elenco') {
                <svg data-p-icon="users" [size]="20"></svg>
              }
              @case ('financeiro') {
                <svg data-p-icon="wallet" [size]="20"></svg>
              }
              @case ('gestao') {
                <svg data-p-icon="briefcase" [size]="20"></svg>
              }
            }
            @if (aba.selo) {
              <span class="abas__selo" [attr.aria-label]="aba.selo + ' pendentes'">{{ aba.selo }}</span>
            }
          </span>
          <span class="abas__rotulo">{{ aba.rotulo }}</span>
        </a>
      }
    </nav>
  }

  <router-outlet />
}
