<div class="cabecalho-secao">
  <h2>Mural</h2>
  <p-button label="Publicar" size="small" (onClick)="novaAberta.set(true)" />
</div>

<app-faixa-patrocinadores />

@if (recados(); as lista) {
  <ul class="feed">
    @for (r of lista; track r.id) {
      <li>
        <app-post-card
          [recado]="r"
          [ehAutor]="r.autorUid === meuUid()"
          [podeModerar]="ehDiretoria()"
          (editar)="editar(r)"
          (fixar)="fixar(r, $event)"
          (excluir)="excluir(r)"
        />
      </li>
    } @empty {
      <li class="texto-suave">Nenhuma postagem ainda. Seja o primeiro a publicar!</li>
    }
  </ul>
  @if (haMais()) {
    <p-button class="ver-mais" label="Ver mais" size="small" [text]="true" severity="secondary" (onClick)="verMais()" />
  }
} @else {
  <div class="feed">
    <p-skeleton height="22rem" />
    <p-skeleton height="8rem" />
  </div>
}

<p-dialog
  header="Nova publicação"
  [visible]="novaAberta()"
  (visibleChange)="enviando() || novaAberta.set($event)"
  [modal]="true"
  [closable]="!enviando()"
  [style]="{ width: 'min(30rem, 100vw - 2rem)' }"
>
  @if (novaAberta()) {
    <app-nova-postagem
      [podeFixar]="ehDiretoria()"
      [enviando]="enviando()"
      [enviadas]="enviadas()"
      (publicar)="publicar($event)"
      (cancelar)="novaAberta.set(false)"
    />
  }
</p-dialog>

<p-dialog
  header="Editar legenda"
  [visible]="emEdicao() !== null"
  (visibleChange)="$event || emEdicao.set(null)"
  [modal]="true"
  [style]="{ width: 'min(30rem, 100vw - 2rem)' }"
>
  <div class="formulario">
    <textarea
      pTextarea
      rows="4"
      [autoResize]="true"
      aria-label="Legenda"
      [ngModel]="textoEdicao()"
      (ngModelChange)="textoEdicao.set($event)"
    ></textarea>
    @if (textoEdicao().length > 2000) {
      <small class="campo__erro">Máximo de 2000 caracteres.</small>
    }
    <div class="acoes">
      <p-button label="Cancelar" [text]="true" (onClick)="emEdicao.set(null)" />
      <p-button label="Salvar" [loading]="salvando()" [disabled]="textoEdicao().length > 2000" (onClick)="salvarEdicao()" />
    </div>
  </div>
</p-dialog>

<p-confirmdialog [style]="{ width: 'min(24rem, 100vw - 2rem)' }" />
